<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0071B3">
<title>NGL General League · Club Hub</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gl:#0071B3;--navy:#14254a;--ink:#16213a;--muted:#5d6782;--line:#e3e6ef;--red:#C9142E;--ok:#1f8a4c;--bad:#C9142E;--cond:'Roboto Condensed','Arial Narrow',sans-serif;--body:'Roboto',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 var(--body);color:var(--ink);background:linear-gradient(180deg,#14254a 0,#1e1a4c 900px,#1e1a4c 100%) #1e1a4c;min-height:100vh}
a{color:var(--gl)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
/* header: same band as the other hubs */
.top{background:var(--gl)}
.strap{text-align:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.04em;padding:7px 16px}
.band{background:linear-gradient(180deg,#29235c 0%,#29235c 40%,#14254a 100%);border-top-right-radius:120px 38px;padding-bottom:4px}
@media(min-width:700px){.band{border-top-right-radius:220px 46px}}
.row{display:flex;align-items:center;gap:10px;min-height:76px;padding:10px 16px;flex-wrap:wrap}
.logo{margin-right:auto;display:block}.logo img{height:50px;display:block}
@media(min-width:700px){.logo img{height:60px}}
.who{color:#fff;text-align:right;font-size:14px;line-height:1.3}.who b{display:block;font-size:16px}
@media(max-width:600px){.who{font-size:0}.who b{font-size:15px}}
.tbtn{display:inline-block;color:#fff;text-decoration:none;font:700 14px var(--body);padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;cursor:pointer}
.tbtn.blue{background:var(--gl);border-color:var(--gl)}
/* tabs: pill buttons like the Club Hub */
nav.tabs{padding:4px 0 6px}
nav.tabs .wrap{display:flex;flex-wrap:wrap;gap:8px}
nav.tabs button{font:700 15px var(--body);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 16px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--gl);border-color:var(--gl)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center;vertical-align:1px}
nav.tabs button[aria-selected="true"] .count{background:#fff;color:var(--red)}
main{padding:18px 0 40px}
h1.page{font:700 40px/1.05 var(--cond);color:#fff;margin:6px 0 8px}
.lead{color:#d9daf2;max-width:780px;margin:0 0 16px;font-size:17px}
h2.sec{font:700 26px/1.1 var(--cond);color:#fff;margin:30px 0 10px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:#fff;border-radius:14px;padding:18px 20px;border-top:5px solid var(--gl);display:flex;flex-direction:column}
.card h3{margin:0 0 6px;color:var(--navy);font:700 21px/1.15 var(--cond)}
.card p{margin:0 0 10px;color:var(--muted);font-size:15px}
.card .btns{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.stat .v{font:700 40px/1 var(--cond);color:var(--navy)}.stat .l{font-weight:700;color:var(--ink);margin-top:4px}.stat .s{font-size:14px;color:var(--muted)}
.stat.go{cursor:pointer;transition:transform .12s}.stat.go:hover{transform:translateY(-2px)}
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font:700 15px var(--body);padding:9px 16px;border-radius:999px;border:1px solid var(--navy);cursor:pointer}
.btn.blue{background:var(--gl);border-color:var(--gl)}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.small{font-size:14px;padding:6px 12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.filters button{font:700 15px var(--body);color:var(--navy);background:#fff;border:1px solid #fff;border-radius:999px;padding:7px 15px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--gl);border-color:var(--gl);color:#fff}
.filters.big button{font-size:17px;padding:10px 22px}
.note{background:#fff7e0;border-left:5px solid #e0a800;border-radius:10px;padding:12px 16px;color:#4a3b00;margin:0 0 14px}
.empty{background:#fff;border-radius:14px;padding:22px;color:var(--muted)}.empty b{display:block;color:var(--navy);font-size:18px;margin-bottom:4px}
.soon{display:inline-block;background:#e8f1f8;color:var(--gl);font-weight:800;font-size:13px;padding:3px 10px;border-radius:12px;margin-bottom:8px;align-self:flex-start}
.ok-pill{display:inline-block;background:#e4f4ea;color:var(--ok);font-weight:800;font-size:13px;padding:3px 10px;border-radius:12px}
.warn-pill{display:inline-block;background:#fff3e0;color:#a65a00;font-weight:800;font-size:13px;padding:3px 10px;border-radius:12px}
.muted{color:var(--muted)}.small{font-size:14px}
.gal{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px}
.gal img{height:200px;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.18);flex:none}
/* competition list */
.comp{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:10px;border-left:6px solid var(--gl)}
.comp.past{opacity:.6}
.comp .d{background:var(--navy);color:#fff;border-radius:10px;text-align:center;padding:6px 0;line-height:1.1}.comp .d b{display:block;font:700 26px var(--cond)}.comp .d span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.comp h4{margin:0;color:var(--navy);font-size:17px}.comp .meta{font-size:14px;color:var(--muted)}
.comp .r{text-align:right}
@media(max-width:620px){.comp{grid-template-columns:56px 1fr}.comp .r{grid-column:1/-1;text-align:left}}
/* rules pages */
.rpages{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.rpages figure{margin:0;background:#fff;border-radius:12px;overflow:hidden}
.rpages img{width:100%;display:block}
.rpages figcaption{padding:8px 12px;font-weight:700;color:var(--navy);font-size:14px}
/* floor music */
.mbar{display:flex;align-items:center;gap:12px;margin:10px 0 2px}
.mbar .track{flex:1;height:10px;background:#e3e6ef;border-radius:5px;overflow:hidden}
.mbar .track i{display:block;height:100%;background:var(--ok)}
.mlevel{font:700 20px var(--cond);color:var(--navy);margin:18px 0 6px}
.mrow{display:grid;grid-template-columns:12px 1fr auto;gap:4px 12px;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.mrow.done{border-left-color:var(--ok)}
.mrow .fl{width:12px;height:12px;border-radius:3px;background:var(--bad)}.mrow.done .fl{background:var(--ok)}
.mrow .n{font-weight:600}.mrow .s{font-size:13px;color:var(--bad)}.mrow.done .s{color:var(--ok)}
.mrow audio{grid-column:2/-1;width:100%;height:34px;margin-top:4px}
.mrow progress{grid-column:2/-1;width:100%;height:6px}
.mrow input[type=file]{display:none}
.mrow label{cursor:pointer}
/* steps (same as Club Hub Reserve places) */
.rsteps{list-style:none;counter-reset:rs;margin:6px 0 18px;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rsteps li{counter-increment:rs;background:#fff;color:var(--ink);border-radius:14px;padding:16px 16px 16px 62px;position:relative;line-height:1.4}
.rsteps li::before{content:counter(rs);position:absolute;left:16px;top:16px;width:34px;height:34px;border-radius:50%;background:var(--gl);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.rsteps b{display:block;font-size:17px;margin-bottom:4px;color:var(--navy)}.rsteps span{font-size:14.5px;color:#4a5370}
@media (max-width:900px){.rsteps{grid-template-columns:1fr}}
.frame{display:block;width:100%;height:900px;border:0;border-radius:16px;background:#f4f5f8;margin:4px 0 30px}
#plFrame{background:#14254a}
/* family hub */
.share{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
@media(max-width:640px){.share{grid-template-columns:1fr}}
.qr{background:#fff;border-radius:12px;padding:12px;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.qr img,.qr canvas{width:176px;height:176px;image-rendering:pixelated}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.linkbox input{flex:1;min-width:220px;font:15px var(--body);padding:9px 12px;border:1px solid var(--line);border-radius:10px}
textarea.msg{width:100%;min-height:150px;font:15px/1.5 var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:10px}
/* sign in */
.auth{max-width:440px;margin:30px auto;background:#fff;border-radius:16px;padding:26px 24px}
.auth h1{font:700 32px/1.1 var(--cond);color:var(--navy);margin:0 0 6px}
.auth label{display:block;font-weight:700;margin:12px 0 4px;font-size:14px}
.auth input{width:100%;font:16px var(--body);padding:10px 12px;border:1px solid #cfd5e2;border-radius:10px}
.auth .btn{width:100%;margin-top:16px;font-size:16px;padding:11px}
.err{color:var(--red);font-size:14px;margin-top:10px}.ok-msg{color:var(--ok);font-size:14px;margin-top:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--gl);font:inherit;text-decoration:underline;cursor:pointer}
.demo{background:#fff7e0;color:#5a4300;border-radius:10px;padding:9px 14px;margin:0 0 14px;font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)}
footer{text-align:center;color:#b9bbdc;font-size:14px;padding:10px 16px 30px}footer a{color:#fff}
</style>
</head>
<body>
<div class="top"><div class="strap">NGL General League · Club Hub</div><div class="band"><div class="wrap row">
  <a class="logo" href="./" aria-label="NGL General League Club Hub"><img src="https://davidcbrooke.github.io/GYMNASTICS-RESULTS/brand/ngl-logo-full.png" alt="NGL"></a>
  <div class="who hidden" id="who"></div>
  <a class="tbtn" href="../#overview">NGL Club Hub</a>
  <button class="tbtn hidden" id="signOut">Log out</button>
</div></div></div>
<nav class="tabs hidden" id="tabs"><div class="wrap"></div></nav>
<main><div class="wrap" id="view"><p style="color:#fff"><span class="spin"></span>Loading…</p></div><div class="wrap" id="bookHost" hidden></div></main>
<footer>National Gymnastics League · 66 Waveney Road, Harpenden, Herts AL5 4QZ · <a href="mailto:admin@nationalgymnasticsleague.co.uk">admin@nationalgymnasticsleague.co.uk</a></footer>

<script src="qrcode.js"></script>
<script type="module">
/* =====================================================================
   NGL General League Club Hub
   Same login as the NGL Club Hub (ngl-schools project, clubs/{uid}).
   Reservations and the Training League come from saadi-rotation (public read),
   floor music from musicEvents / musicUploads (ngl-schools).
   PREVIEW: add ?demo to the address to see sample data (nothing saved).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBK8gNFh4lYv6829YRFm-7Ia0tzh_RwMKQ",
  authDomain: "ngl-schools.firebaseapp.com",
  projectId: "ngl-schools",
  storageBucket: "ngl-schools.firebasestorage.app",
  messagingSenderId: "202087533031",
  appId: "1:202087533031:web:a905eaa461925256b71542"
};
const BOOKINGS_CONFIG = {
  apiKey: "AIzaSyDV7BuYhSjji9DQDjih5a6Ms7G-SVZpKw4",
  authDomain: "saadi-rotation.firebaseapp.com",
  projectId: "saadi-rotation",
  storageBucket: "saadi-rotation.firebasestorage.app",
  messagingSenderId: "1066734803675",
  appId: "1:1066734803675:web:0188fd601adea7db08cafe"
};
const GR = 'https://davidcbrooke.github.io/GYMNASTICS-RESULTS/';
const LINKS = {
  booking:     GR + 'ngl-booking-system.html',
  powerLeague: GR + 'ngl-training-league.html',
  parents:     'https://club.nationalgymnasticsleague.co.uk/family/',
  league2027:  'https://www.nationalgymnasticsleague.co.uk/2027-season-results-and-league-table',
  results2026: 'https://www.nationalgymnasticsleague.co.uk/resultsandleaguetable',
  qualifiers:  GR + 'national-qualifier.html',
  justgo:      ''      // paste the NGL JustGo page here to show an "Enter on JustGo" button
};
const RULES = {
  girls: {label:'Girls', name:'Women’s Artistic', pdf: GR + 'ngl-rules-2027-numbered-update/NGL_General_League_WAG_Rules_2027.pdf', dir: GR + 'ngl-rules-2027-numbered-update/general-wag/'},
  boys:  {label:'Boys',  name:'Men’s Artistic',   pdf: GR + 'ngl-rules-2027-numbered-update/NGL_General_League_MAG_Rules_2027.pdf', dir: GR + 'ngl-rules-2027-numbered-update/general-mag/'}
};
const PAYMENT_DUE_MONTHS = 3;
const MUSIC_MAX_MB = 15;
const PREVIEW = /[?&]demo\b/.test(location.search);
const TABS = [['dashboard','Dashboard'], ['league','League competitions'], ['power','Training League'], ['book','Reserve places'], ['reserved','Your reserved places'], ['music','Floor music'], ['family','Family Hub'], ['licence','Skills book licence']];

const S = {tab:'dashboard', club:null, uid:null, comps:{}, bookings:[], music:[], pl:[], gender:'girls', level:'1', resFilter:'upcoming', loading:true};
window.nglChatClub = () => S.club && S.club.name;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc = s => String(s || '').trim().toLowerCase();
const fmt = d => d ? d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const fmtLong = d => d ? d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'long', year:'numeric'}) : '';
const dayDate = s => { if(!s) return null; const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => new Date(new Date().toDateString());
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function friendlyAuthError(e){
  const c = (e && e.code) || '';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'That email and password don’t match. Please try again.';
  if(c.includes('invalid-email')) return 'Please check the email address.';
  if(c.includes('too-many-requests')) return 'Too many attempts. Please wait a few minutes and try again.';
  if(c.includes('network')) return 'We couldn’t connect. Please check your internet connection.';
  return 'Something went wrong. Please try again.';
}

/* ---------- data ---------- */
let FB = null;
async function fb(){
  if(FB) return FB;
  const v = '10.12.2';
  const [app, auth, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`)
  ]);
  const a = app.initializeApp(FIREBASE_CONFIG), b = app.initializeApp(BOOKINGS_CONFIG, 'bookings');
  FB = {auth, fs, app:a, A:auth.getAuth(a), D:fs.getFirestore(a), B:fs.getFirestore(b)};
  return FB;
}
const isGeneral = (c, name) => c && c.pathway ? c.pathway === 'general' : !/rec/i.test((name || '') + ' ' + ((c && c.level) || ''));
function bookingEmails(){ return [...new Set([S.club && S.club.email, ...((S.club && S.club.bookingEmails) || [])].map(lc).filter(Boolean))]; }
const EMAIL_HASH = {};
async function ensureHashes(){
  for(const e of bookingEmails()){
    if(EMAIL_HASH[e] || !(window.crypto && crypto.subtle)) continue;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(e));
    EMAIL_HASH[e] = Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
  }
}
function glComps(){
  return Object.entries(S.comps).map(([id, c]) => ({id, ...c, d:dayDate(c.date)}))
    .filter(c => isGeneral(c, c.name) && c.d).sort((a, b) => a.d - b.d);
}
function myReservations(){
  const emails = bookingEmails(), hashes = emails.map(e => EMAIL_HASH[e]).filter(Boolean);
  return S.bookings.filter(b => (b.emailHash && hashes.includes(b.emailHash)) || (b.email && emails.includes(lc(b.email))))
    .map(b => { const c = S.comps[b.compId] || {}, date = dayDate(b.compDate || c.date);
      return {...b, comp:c, date, past: date ? date < today() : false}; })
    .filter(r => isGeneral(r.comp, r.compName))
    .sort((a, b) => (a.date || 0) - (b.date || 0));
}
const musicMissing = () => S.music.reduce((n, m) => n + m.mine.filter(g => !m.up[g.id]).length, 0);
const myBoys = () => { const n = lc(S.club && S.club.name); return n ? S.pl.filter(g => lc(g.club) === n) : []; };

async function loadClub(uid){
  const {fs, D} = await fb();
  S.uid = uid;
  const club = await fs.getDoc(fs.doc(D, 'clubs', uid));
  S.club = club.exists() ? club.data() : null;
  if(!S.club) return;
  Promise.all([loadBookings(), loadMusic(), loadPL()]).then(() => { S.loading = false; render(); });
}
async function loadBookings(){
  try{
    const {fs, B} = await fb();
    const [comps, books] = await Promise.all([fs.getDocs(fs.collection(B, 'ngl_competitions')), fs.getDocs(fs.collection(B, 'ngl_bookings')), ensureHashes()]);
    S.comps = Object.fromEntries(comps.docs.map(d => [d.id, d.data()]));
    S.bookings = books.docs.map(d => ({id:d.id, ...d.data()}));
  }catch(e){ console.error(e); S.bookingsError = 'We couldn’t load your reservations just now.'; }
}
function musicMatch(ev){
  const links = ev.links || {}, bg = String((S.club && S.club.bgNumber) || '').trim();
  const hit = Object.entries(ev.clubs || {}).find(([k, c]) => links[k] === S.uid || (bg && String(c.bg || '').trim() === bg));
  if(!hit) return null;
  const [key, club] = hit, mine = [];
  (ev.levels || []).forEach(L => (L.gymnasts || []).forEach(g => { if(g.club === key) mine.push({...g, level:L.id, levelName:L.name, session:L.session || ''}); }));
  return mine.length ? {key, club, mine} : null;
}
async function loadMusic(){
  try{
    const {fs, D} = await fb();
    const evs = await fs.getDocs(fs.query(fs.collection(D, 'musicEvents'), fs.where('status', '==', 'open')));
    const out = [];
    for(const d of evs.docs){
      const ev = {id:d.id, ...d.data()};
      if(/recreational/i.test(ev.title || '')) continue;      // General League hub: General League competitions only
      const m = musicMatch(ev); if(!m) continue;
      const ups = await fs.getDocs(fs.query(fs.collection(D, 'musicUploads'), fs.where('clubId', '==', S.uid), fs.where('compKey', '==', ev.id))).catch(() => ({docs:[]}));
      out.push({ev, ...m, up:Object.fromEntries(ups.docs.map(u => [u.data().gymnastId, u.data()]))});
    }
    S.music = out.sort((a, b) => String(a.ev.date).localeCompare(String(b.ev.date)));
  }catch(e){ console.warn('Floor music not loaded', e); S.music = []; }
}
async function loadPL(){
  try{
    const {fs, B} = await fb();
    const snap = await fs.getDocs(fs.collection(B, 'ngl_power_league'));
    S.pl = snap.docs.map(d => ({id:d.id, ...d.data()}));
  }catch(e){ console.warn('Training League not loaded', e); S.pl = []; }
}
async function uploadMusic(evId, gymId, file, onProgress){
  const m = S.music.find(x => x.ev.id === evId), g = m && m.mine.find(x => x.id === gymId);
  if(!g) throw new Error('not-yours');
  if(PREVIEW){ m.up[gymId] = {gymnastId:gymId, fileName:file.name, url:URL.createObjectURL(file)}; return; }
  const {fs, D, app} = await fb();
  const st = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js');
  const path = `music/${evId}/${S.uid}/${gymId}.mp3`, ref = st.ref(st.getStorage(app), path);
  const task = st.uploadBytesResumable(ref, file, {contentType:'audio/mpeg', customMetadata:{club:m.club.name || '', gymnast:g.name}});
  await new Promise((res, rej) => task.on('state_changed', s => onProgress(s.bytesTransferred / s.totalBytes), rej, res));
  const url = await st.getDownloadURL(ref);
  const rec = {compKey:evId, gymnastId:gymId, gymnastName:g.name, level:g.level, clubKey:m.key, clubName:(S.club && S.club.name) || '', clubId:S.uid,
               fileName:file.name, size:file.size, path, url, uploadedAt:fs.serverTimestamp()};
  await fs.setDoc(fs.doc(D, 'musicUploads', `${evId}_${gymId}`), rec);
  m.up[gymId] = rec;
}

  if(!S.club) return screenAuth();

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-gender],[data-level],[data-rf],[data-act]');
  if(!t) return;
  if(t.dataset.tab){ e.preventDefault(); if(S.club) go(t.dataset.tab); return; }
  if(t.dataset.gender){ S.gender = t.dataset.gender; render(); return; }
  if(t.dataset.level){ S.level = t.dataset.level; render(); return; }
  if(t.dataset.rf){ S.resFilter = t.dataset.rf; render(); return; }
  const a = t.dataset.act;
  if(a === 'copy-link' || a === 'copy-msg'){ const v = a === 'copy-link' ? $('#pLink').value : $('#pMsg').value;
    try{ await navigator.clipboard.writeText(v); toast('Copied'); }catch(_){ (a === 'copy-link' ? $('#pLink') : $('#pMsg')).select(); toast('Press Ctrl+C to copy'); } return; }
  if(a === 'dl-qr'){ const img = $('#qr img'); if(!img) return; const l = document.createElement('a'); l.href = img.src; l.download = 'NGL-parents-QR.gif'; l.click(); return; }
  if(a === 'interest'){ t.disabled = true; const ok = await registerInterest('generalBooks'); render(); toast(ok ? 'You’re on the list for the General League skills books.' : 'Sorry, that didn’t save. Please try again.'); return; }
  if(a === 'forgot'){ const email = ($('#lEmail').value || '').trim(), err = $('#authErr');
    if(!email){ err.className = 'err'; err.textContent = 'Enter your club email first, then press “Forgotten password?”.'; return; }
    try{ const {auth, A} = await fb(); await auth.sendPasswordResetEmail(A, email); err.className = 'ok-msg'; err.textContent = 'If that email has an NGL account, a reset link is on its way.'; }
    catch(x){ err.className = 'err'; err.textContent = friendlyAuthError(x); } return; }
});
document.addEventListener('change', async e => {
  const inp = e.target; if(!inp.dataset || !inp.dataset.music) return;
  const f = inp.files[0]; inp.value = ''; if(!f) return;
  const [evId, gymId] = inp.dataset.music.split('|'), row = inp.closest('.mrow');
  if(!/\.mp3$/i.test(f.name) && f.type !== 'audio/mpeg'){ toast('Please upload an MP3 file.'); return; }
  if(f.size > MUSIC_MAX_MB * 1048576){ toast(`That file is over ${MUSIC_MAX_MB}MB. Please export a smaller MP3.`); return; }
  const bar = document.createElement('progress'); bar.max = 1; bar.value = 0; row.appendChild(bar);
  row.querySelector('label').style.pointerEvents = 'none';
  try{ await uploadMusic(evId, gymId, f, p => { bar.value = p; }); toast('Music uploaded'); render(); }
  catch(err){ console.error(err); bar.remove(); row.querySelector('label').style.pointerEvents = '';
    toast(String(err && err.code).includes('unauthorized') ? 'Upload was blocked. Please contact the NGL.' : 'Upload failed. Check your connection and try again.'); }
});
$('#signOut').onclick = async () => { try{ const {auth, A} = await fb(); await auth.signOut(A); }catch(_){} location.reload(); };
window.addEventListener('message', e => {
  const h = e.data && (e.data.nglBookingHeight || e.data.nglPowerHeight);
  ['bookFrame', 'plFrame'].forEach(id => { const f = document.getElementById(id); if(h && f && e.source === f.contentWindow) f.style.height = (h + 4) + 'px'; });
});

(async () => {
  const h = (location.hash || '').slice(1);
  if(SCREENS[h]) S.tab = h;
  if(PREVIEW){ demoData(); render(); return; }
  try{
    const {auth, A} = await fb();
    auth.onAuthStateChanged(A, async user => {
      if(!user){ S.club = null; screenAuth(); return; }
      try{ await loadClub(user.uid); }catch(e){ console.error(e); }
      if(!S.club) return screenAuth('This login isn’t linked to a club yet. Please register your club in the NGL Club Hub.');
      render();
    });
  }catch(e){ console.error(e); screenAuth('We couldn’t connect. Please check your internet connection.'); }
})();
</script>
