<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGL Club Hub</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/ngl-favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/ngl-favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/ngl-favicon-192.png">
<link rel="apple-touch-icon" href="icons/ngl-apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14254a; --ngl-red:#C9142E; --navy-2:#223a70; --navy-3:#e8ecf5; --red:#c8202f; --gold:#d9a521; --gold-soft:#fbf1d6;
  --paper:#f4f5f8; --ink:#16213a; --muted:#5d6782; --line:#d6dbe6; --white:#fff;
  --ok:#1a7a43; --ok-soft:#e3f3ea; --warn:#a85d00; --warn-soft:#fdf0dc; --bad:#b3261e; --bad-soft:#fbe7e5;
  --schools:#F8D438; --rec:#E88230; --general:#0071B3; --perf:#01AFB8;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);font-size:15.5px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy-2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* Top banner (same style as the Recreational and Schools hubs) */
header.top{position:relative;z-index:30;background:var(--ngl-red)}
.topbar-strap{text-align:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.04em;padding:calc(7px + env(safe-area-inset-top,0px)) 16px 7px}
.topbar-in{background:linear-gradient(180deg,#29235c 0%,#29235c 40%,var(--navy) 100%);border-top-right-radius:120px 38px;padding-bottom:4px}
@media(min-width:700px){.topbar-in{border-top-right-radius:220px 46px}}
.top-row{display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 16px}
.logo{display:flex;align-items:center;margin-right:auto;text-decoration:none}
.logo img{height:50px;width:auto;display:block}
@media(min-width:700px){.logo img{height:60px}}
.who{font-size:13.5px;color:#cfd7ea;text-align:right;line-height:1.3}
.who b{display:block;font-size:14.5px;color:#fff}
.btn-top{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 16px 16px}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;padding:8px 15px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ngl-red);border-color:var(--ngl-red)}
nav.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:#fff;color:var(--ngl-red);font-size:12px;line-height:20px;text-align:center}
nav.tabs button[aria-selected="true"] .count{background:#fff}

main{padding:20px 0 40px}
.demo{background:var(--gold-soft);border:1px solid #ecd28b;color:#5a4300;border-radius:6px;padding:9px 12px;font-size:14px;margin-bottom:16px}
h1.page{font-family:var(--cond);font-size:32px;color:var(--navy);margin:0 0 2px;line-height:1.1}
p.lead{color:var(--muted);margin:0 0 18px}
h2.sec{font-family:var(--cond);font-size:23px;color:var(--navy);margin:26px 0 10px}

/* Cards */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;position:relative}
.card.accent{border-top:5px solid var(--c,var(--navy))}
.card h3{font-family:var(--cond);font-size:22px;margin:0 0 4px;color:var(--navy);line-height:1.15}
.card p{margin:6px 0}
.card .logo{height:46px;width:auto;display:block;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.stat .v{font-family:var(--cond);font-size:34px;font-weight:700;color:var(--navy);line-height:1}
.stat .l{font-size:14px;font-weight:600;color:var(--muted);margin-top:6px}
.stat .s{font-size:13px;color:var(--muted);margin-top:2px}
.stat.alert .v{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:10px 0 4px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.off{background:var(--navy-3);color:var(--muted)}
.ptag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;vertical-align:middle;color:#fff;background:var(--c,var(--navy))}
.ptag.dark{color:#28235B}
.note{background:var(--navy-3);border-radius:6px;padding:10px 12px;font-size:14px;margin:10px 0}
.note.warn{background:var(--warn-soft);color:#5c3600}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:5px;padding:8px 14px;font-weight:600;font-size:14.5px;text-decoration:none;line-height:1.2}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.small{padding:5px 10px;font-size:13.5px}
.btn.red{background:var(--red);border-color:var(--red)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* Tables */
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
table.list{width:100%;border-collapse:collapse;font-size:14.5px;min-width:620px}
table.list th{text-align:left;background:var(--navy-3);color:var(--navy);font-size:13px;font-weight:700;padding:9px 12px;white-space:nowrap}
table.list td{padding:10px 12px;border-top:1px solid #edf0f6;vertical-align:top}
table.list td.num,table.list th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.list tr.past td{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 13px;font-size:14px;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.empty{background:#fff;border:1px dashed var(--line);border-radius:8px;padding:22px;color:var(--muted)}
.empty b{display:block;color:var(--navy);font-family:var(--cond);font-size:20px;margin-bottom:4px}

/* Reservations */
.res{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:start;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c,var(--navy));border-radius:8px;padding:14px 16px;margin-bottom:10px}
.res.past{opacity:.65}
.date{text-align:center;background:var(--navy-3);border-radius:6px;padding:6px 4px;line-height:1.05}
.date b{display:block;font-family:var(--cond);font-size:30px;color:var(--navy)}
.date span{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.res h4{margin:0 0 3px;font-size:16.5px;color:var(--navy)}
.res .meta{font-size:13.5px;color:var(--muted)}
@media (max-width:620px){ .res{grid-template-columns:62px 1fr} .res .act{grid-column:1/-1} .who{display:none} }

/* Forms */
.auth{max-width:440px;margin:28px auto}
.auth .card{padding:22px 24px}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:16px}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.ok-msg{color:var(--ok);font-size:14px;margin-top:10px}
.linkbtn{background:none;border:none;padding:0;color:var(--navy-2);text-decoration:underline;font-size:14px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.inline-form input{flex:1;min-width:220px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:20px 16px 30px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:5px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}

/* Club Support */
.pillar-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.pillar-chip{border:1px solid var(--line);border-left:5px solid var(--c);background:#fff;border-radius:6px;padding:7px 12px;font-weight:700;font-size:14px;color:var(--navy)}
.pillar-chip:hover{background:var(--navy-3)}
.pillar{margin-top:26px;scroll-margin-top:16px}
.pillar-head{display:flex;align-items:center;gap:12px}
.pillar-n{flex:0 0 auto;width:40px;height:40px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--cond);font-size:24px;font-weight:700}
.pillar h2{font-family:var(--cond);font-size:27px;color:var(--navy);margin:0;line-height:1.05}
.pillar-tag{margin:2px 0 0;color:var(--c);font-weight:700;font-size:14.5px}
.pillar-intro{margin:10px 0 8px;max-width:75ch}
.pillar-areas{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0 0 14px}
.pillar-areas li{font-size:13px;font-weight:600;color:var(--muted);background:var(--navy-3);border-radius:12px;padding:3px 10px}
.card.offer{border-top:4px solid var(--c);display:flex;flex-direction:column}
.card.offer .btn-row{margin-top:auto;padding-top:12px}
.offer-kind{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.offer-head{font-weight:700;color:var(--ink);margin:2px 0 4px!important}
</style>
</head>

const PREVIEW = new URLSearchParams(location.search).has('demo');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp = n => '£' + Number(n || 0).toLocaleString('en-GB', {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2});
const toDate = c => !c ? null : (typeof c.toDate === 'function' ? c.toDate() : (c.seconds ? new Date(c.seconds * 1000) : new Date(c)));
const fmt = d => d ? d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const fmtLong = d => d ? d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'long', year:'numeric'}) : '';
const dayDate = s => { if(!s) return null; const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m - 1, d); };
const lc = s => String(s || '').trim().toLowerCase();
function currentSeason(d = new Date()){ const y = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1; return y + '/' + String(y + 1).slice(2); }
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function friendlyAuthError(e){
  const c = (e && e.code) || '';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'That email and password don’t match. Please try again.';
  if(c.includes('email-already-in-use')) return 'There’s already an NGL club account with that email (perhaps from NGL Schools or Recreational). Log in with it instead.';
  if(c.includes('weak-password')) return 'Please choose a password of at least 8 characters.';
  if(c.includes('invalid-email')) return 'Please check the email address.';
  if(c.includes('too-many-requests')) return 'Too many attempts. Please wait a few minutes and try again.';
  if(c.includes('network')) return 'We couldn’t connect. Please check your internet connection.';
  return 'Something went wrong. Please try again.';
}
const CODE_ALPHABET = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function codePrefix(name){
  const words = String(name).toUpperCase().replace(/[^A-Z ]/g,'').split(/\s+/)
    .filter(w => w && !['GYMNASTICS','GYMNASTIC','GYM','CLUB','THE','ACADEMY','OF','AND'].includes(w));
  return (words[0] || 'NGL').slice(0, 10).padEnd(2, 'X');
}
function newAccessCode(name){ const r = new Uint32Array(4); crypto.getRandomValues(r); return codePrefix(name) + '-' + Array.from(r, x => CODE_ALPHABET[x % CODE_ALPHABET.length]).join(''); }

const S = {uid:null, isAdmin:false, club:null, schoolsOrders:[], recOrders:[], bookings:[], comps:{}, bookingsError:'', extraEmails:[], tab:'overview', orderFilter:'all', resFilter:'upcoming', admin:null};
const season = currentSeason();

/* ---------- Licence status ---------- */
const isLicenceOrder = o => (o.type || 'licence') === 'licence';
function schoolsStatus(){
  const c = S.club || {};
  const yearOrders = S.schoolsOrders.filter(o => o.season === season && isLicenceOrder(o));
  const paid = yearOrders.filter(o => o.status === 'paid').reduce((a, o) => a + (o.qty || 0), 0);
  const waiting = yearOrders.filter(o => o.status !== 'paid').reduce((a, o) => a + (o.qty || 0), 0);
  const price = c.bands && c.bands[season];
  if(c.codeActive && (paid || price)) return {key:'active', label:'Active ' + season, cls:'ok', paid, waiting, price};
  if(waiting) return {key:'awaiting', label:'Awaiting payment', cls:'warn', paid, waiting, price};
  if(S.schoolsOrders.length) return {key:'lapsed', label:'Not renewed for ' + season, cls:'bad', paid, waiting, price};
  return {key:'none', label:'Not started', cls:'off', paid, waiting, price};
}
function recStatus(){
  const r = (S.club && S.club.rec) || null;
  const pending = S.recOrders.find(o => (o.kind === 'start' || o.kind === 'renew') && o.status !== 'paid');
  if(r && r.status === 'active' && r.expires){
    const exp = toDate(r.expires), days = Math.ceil((exp - new Date()) / 86400000);
    if(days > 0) return {key:'active', label: days <= 45 ? 'Renew soon' : 'Active', cls: days <= 45 ? 'warn' : 'ok', band:REC_BANDS[r.band], exp, days, pending};
    return {key:'expired', label:'Expired', cls:'bad', band:REC_BANDS[r.band], exp, days, pending};
  }
  if(pending) return {key:'awaiting', label:'Awaiting payment', cls:'warn', pending};
  if(r && r.status === 'inactive') return {key:'off', label:'Switched off', cls:'bad'};
  return {key:'none', label:'Not started', cls:'off'};
}

/* ---------- Orders (Schools + Recreational in one list) ---------- */
function allOrders(){
  const sch = S.schoolsOrders.map(o => ({
    ref:o.id, pathway:'schools', date:toDate(o.createdAt), status:o.status || 'awaiting-payment', paidAt:toDate(o.paidAt),
    desc: o.type === 'graduation' ? `Graduation: ${o.qty} graduate${o.qty === 1 ? '' : 's'}${o.eventTitle ? ' (' + o.eventTitle + ')' : ''}`
                                  : `${o.qty} Schools licence${o.qty === 1 ? '' : 's'}${o.schoolName ? ': ' + o.schoolName : ''}`,
    total:(o.qty || 0) * (o.price || 0), season:o.season, hub:LINKS.schoolsHub
  }));
  const rec = S.recOrders.map(o => {
    const lines = o.lines || [];
    const bits = [];
    if(o.kind === 'start') bits.push('New Club Licence'); else if(o.kind === 'renew') bits.push('Licence renewal'); else if(o.upgradeTo) bits.push('Band upgrade');
    const items = lines.filter(l => ['book','medal','tshirt'].includes(l.kind)).map(l => `${l.qty} ${l.kind === 'book' ? 'book' : l.kind === 'medal' ? 'medal' : 't-shirt'}${l.qty === 1 ? '' : 's'}`);
    if(items.length) bits.push(items.join(', '));
    return {ref:o.id, pathway:'recreational', date:toDate(o.createdAt), status:o.status || 'awaiting-payment', paidAt:toDate(o.paidAt),
      desc: bits.join(' + ') || 'Recreational order', total: lines.reduce((a, l) => a + (l.qty || 0) * (l.unit || 0), 0), season:o.season, hub:LINKS.recHub};
  });
  return [...sch, ...rec].filter(o => o.status !== 'cancelled').sort((a, b) => (b.date || 0) - (a.date || 0));
}
const unpaid = () => allOrders().filter(o => o.status !== 'paid');

/* ---------- Reservations ---------- */
function bookingEmails(){
  const list = [S.club && S.club.email, ...((S.club && S.club.bookingEmails) || []), ...S.extraEmails].map(lc).filter(Boolean);
  return [...new Set(list)];
}
function myReservations(){
  const emails = bookingEmails();
  return S.bookings.filter(b => emails.includes(lc(b.email)))
    .map(b => {
      const c = S.comps[b.compId] || {};
      const date = dayDate(b.compDate || c.date);
      const due = date ? new Date(date.getFullYear(), date.getMonth() - PAYMENT_DUE_MONTHS, date.getDate()) : null;
      const pathway = (c.pathway && PATHWAYS[c.pathway]) ? c.pathway : (/rec/i.test((b.compName || '') + ' ' + (c.level || '')) ? 'recreational' : 'general');
      return {...b, comp:c, date, due, pathway, past: date ? date < new Date(new Date().toDateString()) : false};
    })
    .sort((a, b) => (a.date || 0) - (b.date || 0));
}

let FB = null;
async function fb(){
  if(FB) return FB;
  const v = '10.12.2';
  const [app, auth, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`)
  ]);
  const a = app.initializeApp(FIREBASE_CONFIG);
  const b = app.initializeApp(BOOKINGS_CONFIG, 'bookings');
  FB = {auth, fs, A:auth.getAuth(a), D:fs.getFirestore(a), B:fs.getFirestore(b)};
  return FB;
}
async function loadClub(uid){
  const {fs, D} = await fb();
  S.uid = uid;
  const [club, admin, sch, rec] = await Promise.all([
    fs.getDoc(fs.doc(D, 'clubs', uid)),
    fs.getDoc(fs.doc(D, 'admins', uid)).catch(() => null),
    fs.getDocs(fs.query(fs.collection(D, 'orders'), fs.where('clubId', '==', uid))).catch(() => ({docs:[]})),
    fs.getDocs(fs.query(fs.collection(D, 'recOrders'), fs.where('clubId', '==', uid))).catch(() => ({docs:[]}))
  ]);
  S.club = club.exists() ? club.data() : null;
  S.isAdmin = !!(admin && admin.exists());
  S.schoolsOrders = sch.docs.map(d => ({id:d.id, ...d.data()}));
  S.recOrders = rec.docs.map(d => ({id:d.id, ...d.data()}));
  loadBookings();   // in the background, so the hub opens straight away
}
async function loadBookings(){
  S.bookingsLoading = true; S.bookingsError = '';
  try{
    const {fs, B} = await fb();
    // Reservations are matched on the email used to book. The booking database is
    // public-read today; when its rules are tightened, switch this to a where('email','in',…) query.
    const [comps, books] = await Promise.all([fs.getDocs(fs.collection(B, 'ngl_competitions')), fs.getDocs(fs.collection(B, 'ngl_bookings'))]);
    S.comps = Object.fromEntries(comps.docs.map(d => [d.id, d.data()]));
    S.bookings = books.docs.map(d => ({id:d.id, ...d.data()}));
  }catch(e){ console.error(e); S.bookingsError = 'We couldn’t load your reservations just now.'; }
  S.bookingsLoading = false;
  if(S.club) render();
}

const api = {
  async restore(){
    if(PREVIEW){ demoData(); return true; }
    const {auth, A} = await fb();
    return new Promise(res => {
      const off = auth.onAuthStateChanged(A, async user => {
        off();
        if(!user){ res(false); return; }
        try{ await loadClub(user.uid); res(!!S.club || S.isAdmin); }catch(e){ console.error(e); res(false); }
      });
    });
  },
  async signIn(email, password){
    if(PREVIEW){ demoData(); return {ok:true}; }
    try{
      const {auth, A} = await fb();
      const cred = await auth.signInWithEmailAndPassword(A, email, password);
      await loadClub(cred.user.uid);
      if(!S.club && !S.isAdmin) return {ok:false, reason:'This login isn’t linked to a club yet. Please register your club.'};
      return {ok:true};
    }catch(e){ return {ok:false, reason:friendlyAuthError(e)}; }
  },
  async register(d){
    if(PREVIEW){ demoData(); S.club.name = d.name; return {ok:true}; }
    try{
      const {auth, fs, A, D} = await fb();
      const cred = await auth.createUserWithEmailAndPassword(A, d.email, d.password);
      const uid = cred.user.uid;
      // Every club holds a (switched-off) Schools family code, as NGL Schools and Recreational expect
      let code = '';
      try{
        for(let i = 0; i < 6 && !code; i++){
          const c = newAccessCode(d.name), ref = fs.doc(D, 'accessCodes', c);
          if((await fs.getDoc(ref)).exists()) continue;
          await fs.setDoc(ref, {clubId:uid, clubName:d.name, season, status:'inactive', createdAt:fs.serverTimestamp()});
          code = c;
        }
      }catch(e){ console.warn('Schools code not created', e); }
      await fs.setDoc(fs.doc(D, 'clubs', uid), {name:d.name, bgNumber:d.bgNumber, contact:d.contact, email:d.email, accessCode:code, source:'clubhub', createdAt:fs.serverTimestamp()});
      await loadClub(uid);
      return {ok:true};
    }catch(e){ return {ok:false, reason:friendlyAuthError(e)}; }
  },
  async resetPassword(email){
    if(PREVIEW) return {ok:true};
    try{ const {auth, A} = await fb(); await auth.sendPasswordResetEmail(A, email); return {ok:true}; }
    catch(e){ return {ok:false, reason:friendlyAuthError(e)}; }
  },
  async signOut(){ if(!PREVIEW){ const {auth, A} = await fb(); await auth.signOut(A); } location.reload(); },
  async addBookingEmail(email){
    S.extraEmails.push(email);
    if(PREVIEW) return true;
    try{
      const {fs, D} = await fb();
      await fs.updateDoc(fs.doc(D, 'clubs', S.uid), {bookingEmails: fs.arrayUnion(email)});
      S.club.bookingEmails = [...(S.club.bookingEmails || []), email];
      S.extraEmails = S.extraEmails.filter(e => e !== email);
      return true;
    }catch(e){ console.warn('Booking email not saved', e); return false; }
  },
  async removeBookingEmail(email){
    S.extraEmails = S.extraEmails.filter(e => e !== email);
    if(S.club.bookingEmails) S.club.bookingEmails = S.club.bookingEmails.filter(e => lc(e) !== email);
    if(PREVIEW) return;
    try{ const {fs, D} = await fb(); await fs.updateDoc(fs.doc(D, 'clubs', S.uid), {bookingEmails: fs.arrayRemove(email)}); }catch(e){ console.warn(e); }
  },
  async adminLoad(){
    if(PREVIEW) return demoAdmin();
    const {fs, D} = await fb();
    const [c, o, r] = await Promise.all([
      fs.getDocs(fs.collection(D, 'clubs')),
      fs.getDocs(fs.collection(D, 'orders')).catch(() => ({docs:[]})),
      fs.getDocs(fs.collection(D, 'recOrders')).catch(() => ({docs:[]}))
    ]);
    return {clubs:c.docs.map(d => ({id:d.id, ...d.data()})), orders:o.docs.map(d => ({id:d.id, ...d.data()})), recOrders:r.docs.map(d => ({id:d.id, ...d.data()}))};
  }
};

    <p class="lead">Each NGL programme is its own licence on your club account. Start, renew or order inside each programme’s hub.</p>
    <div class="grid g2">${licenceCard('schools')}${licenceCard('recreational')}${soon('general')}${soon('performance')}</div>`;
}

/* ----- Orders ----- */
function screenOrders(){
  const all = allOrders(), f = S.orderFilter;
  const list = all.filter(o => f === 'all' || (f === 'unpaid' ? o.status !== 'paid' : o.pathway === f));
  const owed = all.filter(o => o.status !== 'paid'), owedTotal = owed.reduce((a, o) => a + o.total, 0);
  const paidYear = all.filter(o => o.status === 'paid' && o.season === season).reduce((a, o) => a + o.total, 0);
  const btn = (k, l) => `<button data-of="${k}" aria-pressed="${f === k}">${l}</button>`;
  return `<h1 class="page">Orders and invoices</h1>
    <p class="lead">Every NGL Schools and Recreational order your club has placed.</p>
    <div class="grid g4" style="margin-bottom:16px">
      <div class="card stat ${owed.length ? 'alert' : ''}"><div class="v">${gbp(owedTotal)}</div><div class="l">Awaiting payment</div><div class="s">${owed.length} order${owed.length === 1 ? '' : 's'}</div></div>
      <div class="card stat"><div class="v">${gbp(paidYear)}</div><div class="l">Paid in ${season}</div></div>
    </div>
    ${owed.length ? `<div class="note"><b>How to pay:</b> bank transfer to ${esc(BANK.accountName)}, sort code <span class="mono">${BANK.sortCode}</span>, account <span class="mono">${BANK.accountNumber}</span>. Use the order reference as your payment reference so we can match it. Invoices can be opened and re-sent from the programme’s hub.</div>` : ''}
    <div class="filters">${btn('all', 'All')}${btn('unpaid', 'Awaiting payment')}${btn('schools', 'Schools')}${btn('recreational', 'Recreational')}</div>
    ${list.length ? `<div class="tablewrap"><table class="list"><thead><tr><th>Date</th><th>Reference</th><th>Programme</th><th>Details</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(o => `<tr><td>${fmt(o.date)}</td><td class="mono">${esc(o.ref)}</td><td>${pathTag(o.pathway)}</td><td>${esc(o.desc)}</td><td class="num">${gbp(o.total)}</td><td>${statusPill(o.status)}${o.paidAt ? `<div class="small muted">${fmt(o.paidAt)}</div>` : ''}</td>
        <td><a class="btn ghost small" href="${o.hub}" target="_blank" rel="noopener">Invoice</a></td></tr>`).join('')}
      </tbody></table></div>`
    : `<div class="empty"><b>${all.length ? 'Nothing here' : 'No orders yet'}</b>${all.length ? 'Try another filter.' : 'Orders you place in the NGL Schools or Recreational hubs will appear here.'}</div>`}`;
}

/* ----- Reservations ----- */
function screenReservations(){
  if(S.bookingsLoading && !S.bookings.length) return `<h1 class="page">Competition reservations</h1><p class="muted"><span class="spin"></span>Loading your reservations…</p>`;
  const all = myReservations(), f = S.resFilter;
  const list = all.filter(r => f === 'all' ? true : f === 'past' ? r.past : !r.past);
  const upcoming = all.filter(r => !r.past), places = upcoming.filter(r => !r.waitlist).reduce((a, r) => a + (r.spaces || 0), 0);
  const emails = bookingEmails();
  const btn = (k, l) => `<button data-rf="${k}" aria-pressed="${f === k}">${l}</button>`;
  const justgo = LINKS.justgo ? `<a class="btn red" href="${LINKS.justgo}" target="_blank" rel="noopener">Enter on JustGo</a>` : '';
  return `<h1 class="page">Competition reservations</h1>
    <p class="lead">Places your club has reserved for NGL competitions.</p>
    <div class="note warn"><b>These are reservations, not entries.</b> Entries and payment are completed on JustGo. “Add to calendar” includes a reminder to complete each entry.</div>
    ${S.bookingsError ? `<div class="note warn">${esc(S.bookingsError)} <button class="linkbtn" data-act="retry-bookings">Try again</button></div>` : ''}
    <div class="grid g4" style="margin:14px 0">
      <div class="card stat"><div class="v">${upcoming.length}</div><div class="l">Upcoming competitions</div></div>
      <div class="card stat"><div class="v">${places}</div><div class="l">Gymnast places reserved</div><div class="s">${upcoming.filter(r => r.waitlist).length} on a waiting list</div></div>
    </div>
    <div class="btn-row" style="margin:0 0 14px">${justgo}<a class="btn ghost" href="${LINKS.reserve}" target="_blank" rel="noopener">Reserve more places</a>${all.length ? '<button class="btn ghost" data-act="ics-all">Add all to my calendar</button>' : ''}</div>
    <div class="filters">${btn('upcoming', 'Upcoming')}${btn('past', 'Past')}${btn('all', 'All')}</div>
    ${list.length ? list.map(r => {
      const p = PATHWAYS[r.pathway] || PATHWAYS.general;
      return `<div class="res${r.past ? ' past' : ''}" style="--c:${p.c}">
        <div class="date">${r.date ? `<span>${r.date.toLocaleDateString('en-GB', {month:'short'})}</span><b>${r.date.getDate()}</b><span>${r.date.getFullYear()}</span>` : '<b>?</b>'}</div>
        <div><h4>${esc(r.compName || r.comp.name || 'NGL competition')}</h4>
          <div class="meta">${pathTag(r.pathway)} ${r.comp.venue ? '· ' + esc(r.comp.venue) : ''} · Ref <span class="mono">${esc(r.reference || r.id)}</span></div>
          <p style="margin:6px 0 0">${r.waitlist ? '<span class="pill warn">Waiting list</span>' : `<b>${r.spaces || 0}</b> gymnast place${r.spaces === 1 ? '' : 's'} reserved`}
          ${!r.waitlist && !r.past && r.due ? `<span class="small muted"> · Complete entries on JustGo from ${fmt(r.due)}</span>` : ''}</p></div>
        <div class="act"><button class="btn ghost small" data-ics="${esc(r.id)}">Add to calendar</button></div></div>`;
    }).join('')
    : `<div class="empty"><b>${all.length ? 'Nothing here' : 'No reservations found'}</b>${all.length ? 'Try another filter.' : 'We match reservations by the email address used to book. If your club booked with a different email, add it below.'}</div>`}
    <div class="card" style="margin-top:18px"><h3>Booking emails</h3>
      <p class="small muted">Reservations made with any of these emails show here.</p>
      <p>${emails.map(e => `<span class="pill off" style="margin:0 6px 6px 0">${esc(e)}${lc(S.club.email) === e ? '' : ` <button class="linkbtn" data-rm-email="${esc(e)}" aria-label="Remove ${esc(e)}">✕</button>`}</span>`).join('')}</p>
      <form class="inline-form" id="emailForm"><input class="f" type="email" id="newEmail" placeholder="another@email.com" required><button class="btn">Add email</button></form>
      <div id="emailMsg"></div></div>`;
}

/* ----- Club ----- */
function screenClub(){
  const c = S.club;
  return `<h1 class="page">Your club</h1>
    <p class="lead">The details NGL holds for your club account.</p>
    <div class="grid g2">
      <div class="card"><h3>Club details</h3>
        <dl class="kv"><dt>Club</dt><dd>${esc(c.name)}</dd><dt>BG club number</dt><dd>${esc(c.bgNumber || '–')}</dd><dt>Main contact</dt><dd>${esc(c.contact || '–')}</dd><dt>Login email</dt><dd>${esc(c.email || '–')}</dd></dl>
        <div class="btn-row"><a class="btn ghost" href="mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent('Club details change: ' + c.name)}">Ask us to update your details</a></div></div>
      <div class="card"><h3>Family access codes</h3>
        <p class="small muted">Share these with your families so they can open the parent pages.</p>
        <dl class="kv"><dt>NGL Schools</dt><dd class="mono">${esc(c.accessCode || '–')} ${c.codeActive ? '<span class="pill ok">Live</span>' : '<span class="pill off">Off</span>'}</dd>
          <dt>NGL Recreational</dt><dd class="mono">${esc(c.recCode || '–')} ${c.recCode && recStatus().key === 'active' ? '<span class="pill ok">Live</span>' : '<span class="pill off">Off</span>'}</dd></dl>
        <p class="small muted">Codes switch on when the licence is active. Change a code from the programme’s hub.</p></div>
      <div class="card"><h3>Password</h3><p class="small muted">We’ll email a link to ${esc(c.email || 'your login email')} to set a new password. It works for every NGL hub.</p>
        <div class="btn-row"><button class="btn ghost" data-act="reset-me">Email me a reset link</button></div><div id="resetMsg"></div></div>
    </div>`;
}

/* ----- Admin: all clubs ----- */
function screenAdmin(){
  if(!S.admin) return `<h1 class="page">All clubs</h1><p class="muted"><span class="spin"></span>Loading every club…</p>`;
  const {clubs, orders, recOrders} = S.admin, now = new Date();
  const owed = id => [...orders.filter(o => o.clubId === id && o.status !== 'paid').map(o => (o.qty || 0) * (o.price || 0)),
                      ...recOrders.filter(o => o.clubId === id && o.status !== 'paid').map(o => (o.lines || []).reduce((a, l) => a + l.qty * l.unit, 0))].reduce((a, b) => a + b, 0);
  const rows = clubs.slice().sort((a, b) => String(a.name).localeCompare(String(b.name))).map(c => {
    const r = c.rec, exp = r && toDate(r.expires), recOn = r && r.status === 'active' && exp > now;
    return {c, recOn, exp, schOn: !!c.codeActive, owed: owed(c.id)};
  });
  const total = rows.reduce((a, r) => a + r.owed, 0);
  return `<h1 class="page">All clubs</h1>
    <p class="lead">NGL admin view. Approve payments in the Schools and Recreational hubs.</p>
    <div class="grid g4" style="margin-bottom:16px">
      <div class="card stat"><div class="v">${rows.length}</div><div class="l">Club accounts</div></div>
      <div class="card stat"><div class="v">${rows.filter(r => r.schOn).length}</div><div class="l">Schools active</div></div>
      <div class="card stat"><div class="v">${rows.filter(r => r.recOn).length}</div><div class="l">Recreational active</div></div>
      <div class="card stat ${total ? 'alert' : ''}"><div class="v">${gbp(total)}</div><div class="l">Awaiting payment</div></div>
    </div>
    <div class="tablewrap"><table class="list"><thead><tr><th>Club</th><th>Contact</th><th>Schools</th><th>Recreational</th><th class="num">Awaiting payment</th></tr></thead><tbody>
    ${rows.map(({c, recOn, exp, schOn, owed}) => `<tr><td><b>${esc(c.name || 'Unnamed')}</b><div class="small muted">${esc(c.bgNumber || '')}</div></td><td>${esc(c.contact || '')}<div class="small muted">${esc(c.email || '')}</div></td>
      <td>${schOn ? '<span class="pill ok">Active</span>' : '<span class="pill off">–</span>'}</td>
      <td>${recOn ? `<span class="pill ok">${esc((REC_BANDS[c.rec.band] || {}).short || 'Active')}</span><div class="small muted">to ${fmt(exp)}</div>` : (c.rec ? '<span class="pill bad">Lapsed</span>' : '<span class="pill off">–</span>')}</td>
      <td class="num">${owed ? `<b style="color:var(--bad)">${gbp(owed)}</b>` : '–'}</td></tr>`).join('')}
    </tbody></table></div>`;
}
async function loadAdmin(){
  if(S.admin || S.adminLoading) return;
  S.adminLoading = true;
  try{ S.admin = await api.adminLoad(); }catch(e){ console.error(e); S.admin = {clubs:[], orders:[], recOrders:[]}; toast('Couldn’t load all clubs.'); }
  S.adminLoading = false;
  if(S.tab === 'admin') render();
}

/* ----- Sign in / register ----- */
function screenAuth(mode, msg){
  setChrome(false);
  const v = $('#view');
  if(mode === 'register'){
    v.innerHTML = `<div class="auth"><h1 class="page">Register your club</h1><p class="lead">One NGL account for every programme: Schools, Recreational and competitions.</p>
      <div class="card"><form id="regForm">
        <label class="f" for="rName">Club name</label><input class="f" id="rName" required autocomplete="organization">
        <label class="f" for="rBg">British Gymnastics club number</label><input class="f" id="rBg" required>
        <label class="f" for="rContact">Main contact</label><input class="f" id="rContact" required autocomplete="name">
        <label class="f" for="rEmail">Club email (this is your login)</label><input class="f" id="rEmail" type="email" required autocomplete="email">
        <label class="f" for="rPass">Password</label><input class="f" id="rPass" type="password" minlength="8" required autocomplete="new-password">
        <div class="btn-row"><button class="btn" type="submit">Create club account</button></div>
        <div class="err" id="authErr"></div></form>
        <p class="small" style="margin-top:14px">Already registered for NGL Schools or Recreational? <button class="linkbtn" data-auth="login">Log in with the same details</button></p></div></div>`;
    return;
  }
  v.innerHTML = `<div class="auth"><h1 class="page">NGL Club Hub</h1><p class="lead">Your licences, orders and competition reservations in one place.</p>
    ${PREVIEW ? '<div class="demo">Preview mode: any email and password opens the sample club.</div>' : ''}
    <div class="card"><form id="loginForm">
      <label class="f" for="lEmail">Club email</label><input class="f" id="lEmail" type="email" required autocomplete="email">
      <label class="f" for="lPass">Password</label><input class="f" id="lPass" type="password" required autocomplete="current-password">
      <div class="btn-row"><button class="btn" type="submit">Log in</button><button class="linkbtn" type="button" data-auth="forgot" style="margin-left:auto">Forgotten password?</button></div>
      <div class="${msg && msg.ok ? 'ok-msg' : 'err'}" id="authErr">${msg ? esc(msg.text) : ''}</div></form>
      <p class="small muted" style="margin-top:14px">Use the same login as the NGL Schools or Recreational hub.</p>
      <p class="small">New to NGL? <button class="linkbtn" data-auth="register">Register your club</button></p></div></div>`;
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click', async e => {
  const j = e.target.closest('[data-jump]');
  if(j){ const el = document.getElementById(j.dataset.jump); if(el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); return; }
  const t = e.target.closest('[data-tab],[data-of],[data-rf],[data-act],[data-ics],[data-auth],[data-rm-email]');
  if(!t) return;
  if(t.dataset.tab){ e.preventDefault(); if(S.club || S.isAdmin) go(t.dataset.tab); return; }
  if(t.dataset.of){ S.orderFilter = t.dataset.of; render(); return; }
  if(t.dataset.rf){ S.resFilter = t.dataset.rf; render(); return; }
  if(t.dataset.ics){ const r = myReservations().find(x => x.id === t.dataset.ics); if(r) downloadIcs([r], 'NGL-' + (r.compName || 'Competition').replace(/\W+/g, '-')); return; }
  if(t.dataset.rmEmail){ await api.removeBookingEmail(t.dataset.rmEmail); render(); return; }
  if(t.dataset.auth === 'register') return screenAuth('register');
  if(t.dataset.auth === 'login') return screenAuth('login');
  if(t.dataset.auth === 'forgot'){
    const email = ($('#lEmail').value || '').trim(), err = $('#authErr');
    if(!email){ err.className = 'err'; err.textContent = 'Enter your club email first, then press “Forgotten password?”.'; return; }
    const r = await api.resetPassword(email);
    err.className = r.ok ? 'ok-msg' : 'err'; err.textContent = r.ok ? 'If that email has an NGL account, a reset link is on its way.' : r.reason; return;
  }
  const a = t.dataset.act;
  if(a === 'ics-all'){ const list = myReservations().filter(r => !r.past); if(list.length) downloadIcs(list, 'NGL-My-Reservations'); else toast('No upcoming reservations to add.'); }
  if(a === 'retry-bookings'){ await loadBookings(); }
  if(a === 'reset-me'){ const r = await api.resetPassword(S.club.email); $('#resetMsg').innerHTML = `<div class="${r.ok ? 'ok-msg' : 'err'}">${r.ok ? 'Reset link sent. Check your inbox.' : esc(r.reason)}</div>`; }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button[type="submit"], button:not([type])');
  if(btn) btn.disabled = true;
  try{
    if(f.id === 'loginForm'){
      const r = await api.signIn($('#lEmail').value.trim(), $('#lPass').value);
      if(r.ok) start(); else $('#authErr').textContent = r.reason;
    }
    if(f.id === 'regForm'){
      const d = {name:$('#rName').value.trim(), bgNumber:$('#rBg').value.trim(), contact:$('#rContact').value.trim(), email:$('#rEmail').value.trim(), password:$('#rPass').value};
      const r = await api.register(d);
      if(r.ok) start(); else $('#authErr').textContent = r.reason;
    }
    if(f.id === 'emailForm'){
      const email = lc($('#newEmail').value);
      if(!email.includes('@')) return;
      if(bookingEmails().includes(email)){ $('#emailMsg').innerHTML = '<div class="err">That email is already on the list.</div>'; return; }
      const saved = await api.addBookingEmail(email);
      render();
      if(!saved) $('#emailMsg').innerHTML = '<div class="err">Added for now, but we couldn’t save it to your account. Please email us so we can add it.</div>';
    }
  } finally { if(btn) btn.disabled = false; }
});
$('#signOutBtn').addEventListener('click', () => api.signOut());

/* ---------- Calendar export (same events as the booking system) ---------- */
function icsDate(d){ return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
function icsEscape(s){ return String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n'); }
function downloadIcs(list, file){
  const ev = [];
  list.forEach(r => {
    if(!r.date) return;
    const end = new Date(r.date); end.setDate(end.getDate() + 1);
    ev.push(['BEGIN:VEVENT', `UID:${r.id}@ngl-club-hub`, `DTSTART;VALUE=DATE:${icsDate(r.date)}`, `DTEND;VALUE=DATE:${icsDate(end)}`,
      `SUMMARY:${icsEscape((r.compName || 'NGL Competition') + (r.waitlist ? ' (Waiting List)' : ''))}`,
      `DESCRIPTION:${icsEscape(`Reference ${r.reference || r.id}. ${r.waitlist ? 'Waiting list.' : (r.spaces || 0) + ' gymnast places reserved. Complete entries on JustGo.'}`)}`,
      r.comp.venue ? `LOCATION:${icsEscape(r.comp.venue)}` : '', 'END:VEVENT'].filter(Boolean).join('\r\n'));
    if(!r.waitlist && r.due && r.due > new Date()){
      const de = new Date(r.due); de.setDate(de.getDate() + 1);
      ev.push(['BEGIN:VEVENT', `UID:${r.id}-entries@ngl-club-hub`, `DTSTART;VALUE=DATE:${icsDate(r.due)}`, `DTEND;VALUE=DATE:${icsDate(de)}`,
        `SUMMARY:${icsEscape('Complete JustGo entries: ' + (r.compName || 'NGL Competition'))}`,
        `DESCRIPTION:${icsEscape(`Reference ${r.reference || r.id}. Complete your entries and payment on JustGo.`)}`, 'END:VEVENT'].join('\r\n'));
    }
  });
  if(!ev.length){ toast('No dated reservations to add.'); return; }
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//NGL Club Hub//EN', 'X-WR-CALNAME:' + icsEscape((S.club ? S.club.name : 'NGL') + ' NGL competitions'), ...ev, 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'})); a.download = file + '.ics'; a.click();
}

/* =====================================================================
   START
   ===================================================================== */
async function start(){
  const h = (location.hash || '').slice(1);
  if(h && [...TABS.map(t => t[0]), 'admin'].includes(h)) S.tab = h;
  render();
}
(async () => {
  try{
    const ok = await api.restore();
    if(ok) start(); else screenAuth('login');
  }catch(e){
    console.error(e);
    $('#view').innerHTML = '<div class="empty"><b>We couldn’t open the Club Hub</b>Please check your internet connection and refresh the page.</div>';
  }
})();
</script>
