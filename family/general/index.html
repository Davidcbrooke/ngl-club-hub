<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGL General League Hub · Families</title>
<meta name="description" content="NGL General League for families: results, the National League Table, National Finals qualifiers and the Training League.">
<meta name="theme-color" content="#0071B3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NGL General">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/ngl-favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/ngl-favicon-192.png">
<link rel="apple-touch-icon" href="/img/apps/general.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0a1440;--navy-2:#0d1a4f;--navy-3:#152463;--navy-4:#1d2f7a;--line:rgba(255,255,255,0.14);--white:#fff;--muted:#b7c1e6;--gl:#0071B3;--gl-bright:#3aa0e6;--gl-ink:#fff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--navy);color:var(--white);font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  a{color:var(--gl-bright);}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px;}

  .topbar{position:relative;z-index:30;background:var(--gl);width:100vw;margin-left:calc(50% - 50vw);}
  .topbar-strap{text-align:center;color:var(--gl-ink);font-weight:800;font-size:13px;letter-spacing:.02em;padding:calc(7px + env(safe-area-inset-top,0px)) 16px 7px;}
  .topbar-in{background:linear-gradient(180deg,#2a245f 0%,#2a245f 40%,var(--navy) 100%);border-top-right-radius:120px 38px;padding-bottom:18px;}
  @media(min-width:700px){.topbar-in{border-top-right-radius:220px 46px;}}
  .topbar-row{display:flex;align-items:center;gap:12px;min-height:66px;}
  .logo{display:flex;align-items:center;text-decoration:none;}
  .logo img{height:50px;width:auto;display:block;}
  @media(min-width:700px){.logo img{height:58px;}}
  .fhub{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:#fff;text-decoration:none;font:700 13.5px/1 Roboto,system-ui,sans-serif;padding:8px 12px 8px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);white-space:nowrap;flex:none}
  .fhub svg{width:16px;height:16px;flex:none}.fhub:hover{background:rgba(255,255,255,.2)}

  .navtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 12px;}
  .navtabs::-webkit-scrollbar{display:none;}
  .navtab{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--navy-3);color:#fff;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;}
  .navtab.active{background:var(--gl);border-color:var(--gl);color:var(--gl-ink);}

  main{padding:18px 0 60px;}
  .screen{animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none;}}
  h1{font-size:clamp(28px,5vw,44px);line-height:1.08;margin:0 0 12px;font-weight:900;letter-spacing:-.015em;text-wrap:balance;}
  p{line-height:1.55;margin:0 0 10px;}
  .muted{color:var(--muted);}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gl-bright);font-weight:800;margin:0 0 10px;}
  .card{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;}
  .lead{font-size:17px;color:var(--muted);margin:0;}

  .tiles{display:grid;gap:12px;grid-template-columns:1fr;margin:0 0 18px;}
  @media(min-width:700px){.tiles{grid-template-columns:1fr 1fr;}}
  .tile{display:flex;align-items:center;gap:14px;background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:16px;color:#fff;text-decoration:none;transition:transform .15s ease,border-color .15s ease;}
  .tile:hover{transform:translateY(-2px);border-color:rgba(58,160,230,.6);}
  .tile .ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--gl);display:flex;align-items:center;justify-content:center;}
  .tile .ic svg{width:30px;height:30px;}
  .tile b{display:block;font-size:17px;font-weight:800;margin-bottom:2px;color:#fff;}
  .tile span{display:block;color:var(--muted);font-size:14px;line-height:1.4;}
  .tile .go{margin-left:auto;flex:none;color:var(--gl-bright);}
  .tile .go svg{width:20px;height:20px;display:block;}
  .more{text-align:center;color:var(--muted);margin:8px 0 0;}

  /* A section: the page itself, filling the screen under the tabs */
  body.sec main{padding:0;}
  #frames{padding:0 0 16px;}
  .frame{width:100%;border:0;display:block;border-radius:16px;background:#fff;}
  .frame.dark{background:var(--navy);}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-strap">General League · Families</div><div class="topbar-in">
  <div class="wrap topbar-row">
    <a class="logo" href="#" aria-label="NGL General League Hub home"><img src="/img/brand/ngl-general-league-logo.png" alt="NGL General League"></a>
    <a class="fhub" href="../" aria-label="Back to the NGL Family Hub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Family Hub</a>
  </div>
</div></header>
<div class="wrap">
  <nav class="navtabs" id="navtabs" aria-label="General League Hub"></nav>
  <main id="view"></main>
  <div id="frames"></div>
</div>
<script>
const GH = 'https://davidcbrooke.github.io/GYMNASTICS-RESULTS/';
const I = d => `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const SECTIONS = [
  {k:'results2026', tab:'2026 results', title:'2026 results', sub:'Every result and the National League Table from this season.', src: GH + 'RESULTS-VIEWER.HTML',
   icon: I('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 4 4M16 6h3a3 3 0 0 1-4 4"/><path d="M12 13v4M8 21h8M9.5 21l.5-4h4l.5 4"/>')},
  {k:'league', tab:'2027 league table', title:'2027 league table', sub:'Live scores and the National League Table for the 2027 season.', src: GH + 'ngl-live-league-2027.html?family=1',
   icon: I('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11"/>')},
  {k:'qualifiers', tab:'National Finals qualifiers', title:'National Finals qualifiers', sub:'Who has qualified to represent their region at the NGL National Finals.', src: GH + 'national-qualifier.html?family=1',
   icon: I('<circle cx="12" cy="14" r="6"/><path d="M9 3l3 5 3-5M12 11l1 2 2 .3-1.5 1.4.4 2.1-1.9-1-1.9 1 .4-2.1L9 13.3l2-.3z"/>')},
  {k:'training', tab:'Training League', title:'Training League', sub:'13 challenges filmed in training, for boys and girls, with NGL Profile Cards.', src: GH + 'ngl-training-league.html?site=1', dark:true,
   icon: I('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>')}
];
const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
const view = document.getElementById('view'), tabs = document.getElementById('navtabs'), box = document.getElementById('frames');
const frames = {};

function home(){
  document.body.classList.remove('sec'); box.querySelectorAll('iframe').forEach(f => f.hidden = true);
  view.innerHTML = `<div class="screen">
    <div class="card">
      <div class="eyebrow">NGL General League · Families</div>
      <h1>Follow every result</h1>
      <p class="lead">Results, the National League Table, National Finals qualifiers and the Training League, all in one place. Open to every NGL family, no code needed.</p>
    </div>
    <div class="tiles">${SECTIONS.map(s => `<a class="tile" href="#${s.k}"><span class="ic">${s.icon}</span><span><b>${s.title}</b><span>${s.sub}</span></span><span class="go">${CHEV}</span></a>`).join('')}</div>
    <p class="more">Is your gymnast’s club in the NGL? <a href="https://club.nationalgymnasticsleague.co.uk/#register" target="_top">Find out how to join</a></p>
  </div>`;
}
function section(s){
  document.body.classList.add('sec');
  if(!frames[s.k]){ const f = document.createElement('iframe'); f.className = 'frame' + (s.dark ? ' dark' : ''); f.title = s.title; f.src = s.src; frames[s.k] = f; box.appendChild(f); }
  view.innerHTML = ''; Object.values(frames).forEach(f => f.hidden = f !== frames[s.k]); size();
}
/* The page fills the screen below the tabs and scrolls inside itself */
function size(){ const f = [...box.querySelectorAll('iframe')].find(x => !x.hidden); if(!f) return; const top = f.getBoundingClientRect().top + window.scrollY; f.style.height = Math.max(420, window.innerHeight - top - 16) + 'px'; }
function route(){
  const k = (location.hash || '').slice(1), s = SECTIONS.find(x => x.k === k);
  tabs.innerHTML = [`<a class="navtab${s ? '' : ' active'}" href="#">Home</a>`, ...SECTIONS.map(x => `<a class="navtab${s && s.k === x.k ? ' active' : ''}" href="#${x.k}">${x.tab}</a>`)].join('');
  const on = tabs.querySelector('.active'); if(on) on.scrollIntoView({block:'nearest', inline:'nearest'});
  s ? section(s) : home();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route); addEventListener('resize', size); route();
</script>
</body>
</html>
